<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>@allinone_reborn</title>

  <!-- JW Player Library -->
  <script src="https://cdn.jwplayer.com/libraries/IDzF9Zmk.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .player-wrap {
      width: 90%;
      max-width: 900px; /* limit size on big screens */
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    #my-jwplayer {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>

<div class="player-wrap">
  <div id="my-jwplayer"></div>
</div>

<script>
(function(){
  const urlParams = new URLSearchParams(window.location.search);
  const streamUrl = urlParams.get('url') || '';

  if(streamUrl){
    jwplayer("my-jwplayer").setup({
      file: streamUrl,
      type: "hls",
      width: "100%",
      aspectratio: "16:9",
      autostart: true,
      mute: false,
      controls: true,
      stretching: "uniform",
      skin: { name: "seven" }
    });
  } else {
    document.getElementById("my-jwplayer").innerHTML =
      "<p style='color:#fff;text-align:center;padding:20px;'>No stream URL provided</p>";
  }
})();
</script>

</body>
</html>
